# Read the Docs builds the OmniPython documentation site, project pydevices,
# from this repository (Settings > "Path for .readthedocs.yaml" stays at the
# default). gather.py clones every library listed in docs-site/libraries.toml
# and copies its docs in; the shared theme comes from docs-config/.
#
# Warnings don't fail this build: one library's bad page shouldn't hold back
# every other library's update. Each library's own CI fails on its warnings,
# built alone and on the site (docs/guides/build-and-publish-docs.md).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  # pydevices' SDL backends load libSDL2 when autodoc imports them.
  apt_packages:
    - libsdl2-2.0-0
  jobs:
    pre_build:
      - python docs-site/gather.py

sphinx:
  configuration: docs-site/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs-site/requirements.txt
