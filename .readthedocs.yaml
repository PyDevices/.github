# Read the Docs builds the PyDevices main documentation project from this
# repository (Settings > "Path for .readthedocs.yaml" stays at the default).
# The shared theme and configuration come from docs-config/, in the same tree.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs-site/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs-site/requirements.txt
