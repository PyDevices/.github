# Open a release PR: VERSION bump + CHANGELOG section. The human choice of
# version happens here -- the PR is where the version is read, edited, and
# approved before anything is tagged (deliberate-exceptions ledger: versions
# are chosen by a human; automation must preserve that).
#
# Call from a workflow_dispatch caller with an optional version input; empty
# computes highest existing vX.Y.Z tag + 1 patch as the *suggestion*.
name: Reusable prepare release PR

on:
  workflow_call:
    inputs:
      version:
        description: Release version X.Y.Z[{a|b|rc}N|.devN]; empty = a SUGGESTED highest-tag+1-patch value the reviewer is expected to confirm or overwrite in the PR
        default: ""
        type: string

permissions:
  contents: read

jobs:
  open-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PYDEVICES_APP_ID }}
          private-key: ${{ secrets.PYDEVICES_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [[ -n "$REQUESTED" ]]; then
            V="$REQUESTED"
          else
            LAST=$(git tag --list 'v[0-9]*' | sed 's/^v//' \
              | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            if [[ -z "$LAST" ]]; then V="0.0.1"; else
              V=$(python3 -c 'import re,sys; m=re.match(r"(\d+)\.(\d+)\.(\d+)", sys.argv[1]); print(f"{m[1]}.{m[2]}.{int(m[3])+1}")' "$LAST")
            fi
          fi
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+|\.dev[0-9]+)?$ ]]; then
            echo "Bad version: $V" >&2; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "Tag v$V already exists" >&2; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Write VERSION and CHANGELOG
        id: prep
        env:
          V: ${{ steps.version.outputs.version }}
          CHANGELOG: CHANGELOG.md
          BULLETS: /tmp/bullets.md
        run: |
          printf '%s\n' "$V" > VERSION
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          RANGE=()
          [[ -n "$LAST_TAG" ]] && RANGE=("$LAST_TAG..HEAD")
          git log --no-merges --format='- %s' "${RANGE[@]}" > "$BULLETS"
          RELEASE_DATE="$(date -u +%Y-%m-%d)" python3 - <<'PY'
          import os

          # Where the release section goes depends on what the changelog already
          # says. A repository that accumulates notes under "## Unreleased"
          # between releases means that block: the release being cut IS those
          # notes, so the heading becomes the version and the git log joins the
          # section. Inserting above it instead would strand the block below a
          # released version and file this release's own notes under
          # "Unreleased" in the published artifact (.github#40).
          version = os.environ["V"]
          date = os.environ["RELEASE_DATE"]
          changelog = os.environ["CHANGELOG"]
          heading = f"## v{version} ({date})"

          try:
              with open(changelog, encoding="utf-8") as handle:
                  lines = handle.read().splitlines()
          except FileNotFoundError:
              lines = []

          with open(os.environ["BULLETS"], encoding="utf-8") as handle:
              bullets = [line for line in handle.read().splitlines() if line.strip()]

          # The first level-2 heading is where the released history starts;
          # anything above it is the file's title and preamble and stays put.
          first = next(
              (i for i, line in enumerate(lines) if line.startswith("## ")),
              len(lines),
          )
          unreleased = (
              first < len(lines)
              and lines[first][3:].strip().lower().rstrip(":").startswith("unreleased")
          )

          if unreleased:
              # Convert the block: its heading becomes this version, and the
              # generated bullets are appended after the notes already written.
              end = next(
                  (
                      i
                      for i in range(first + 1, len(lines))
                      if lines[i].startswith("## ")
                  ),
                  len(lines),
              )
              body = lines[first + 1 : end]
              while body and not body[0].strip():
                  body.pop(0)
              while body and not body[-1].strip():
                  body.pop()
              section = [heading, ""] + body
              if bullets:
                  if body:
                      section.append("")
                  section.extend(bullets)
              lines[first:end] = section + [""]
          else:
              section = [heading, ""] + bullets + [""]
              lines[first:first] = section

          # A preamble must keep its blank line before the section that follows.
          if first and lines[first - 1].strip():
              lines.insert(first, "")

          with open(changelog, "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines).rstrip("\n") + "\n")
          PY

      - name: Open the release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          BRANCH="release/v$V"
          git config user.name "pydevices-release-automation[bot]"
          git config user.email "pydevices-release-automation[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add VERSION CHANGELOG.md
          git commit -m "Release $V"
          git push -f origin "$BRANCH"
          gh pr create --head "$BRANCH" --title "Release $V" --body \
            "Automated release PR. **The version is yours to change** -- edit VERSION on this branch before merging if $V is not the right call. Merging tags the version in VERSION and triggers publication; closing publishes nothing." \
            || gh pr edit "$BRANCH" --title "Release $V"
