# Open a release PR: VERSION bump + CHANGELOG section. The human choice of
# version happens here -- the PR is where the version is read, edited, and
# approved before anything is tagged (deliberate-exceptions ledger: versions
# are chosen by a human; automation must preserve that).
#
# Call from a workflow_dispatch caller with an optional version input; empty
# computes highest existing vX.Y.Z tag + 1 patch as the *suggestion*.
name: Reusable prepare release PR

on:
  workflow_call:
    inputs:
      version:
        description: Release version X.Y.Z[{a|b|rc}N|.devN]; empty = highest tag + 1 patch
        default: ""
        type: string

permissions:
  contents: read

jobs:
  open-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PYDEVICES_APP_ID }}
          private-key: ${{ secrets.PYDEVICES_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [[ -n "$REQUESTED" ]]; then
            V="$REQUESTED"
          else
            LAST=$(git tag --list 'v[0-9]*' | sed 's/^v//' \
              | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            if [[ -z "$LAST" ]]; then V="0.0.1"; else
              V=$(python3 -c 'import re,sys; m=re.match(r"(\d+)\.(\d+)\.(\d+)", sys.argv[1]); print(f"{m[1]}.{m[2]}.{int(m[3])+1}")' "$LAST")
            fi
          fi
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+|\.dev[0-9]+)?$ ]]; then
            echo "Bad version: $V" >&2; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "Tag v$V already exists" >&2; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Write VERSION and CHANGELOG
        id: prep
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          printf '%s\n' "$V" > VERSION
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          RANGE=${LAST_TAG:+$LAST_TAG..HEAD}
          {
            echo "## v$V ($(date -u +%Y-%m-%d))"
            echo
            git log --no-merges --format='- %s' $RANGE
            echo
          } > /tmp/section.md
          touch CHANGELOG.md
          cat /tmp/section.md CHANGELOG.md > /tmp/changelog.md
          mv /tmp/changelog.md CHANGELOG.md

      - name: Open the release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          BRANCH="release/v$V"
          git config user.name "pydevices-release-automation[bot]"
          git config user.email "pydevices-release-automation[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add VERSION CHANGELOG.md
          git commit -m "Release $V"
          git push -f origin "$BRANCH"
          gh pr create --head "$BRANCH" --title "Release $V" --body \
            "Automated release PR. **The version is yours to change** -- edit VERSION on this branch before merging if $V is not the right call. Merging tags the version in VERSION and triggers publication; closing publishes nothing." \
            || gh pr edit "$BRANCH" --title "Release $V"
