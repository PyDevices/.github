name: Reusable synchronize MIP package

on:
  workflow_call:
    inputs:
      source-repository:
        required: true
        type: string
      source-ref:
        required: true
        type: string
      version:
        required: true
        type: string
      profile:
        required: true
        type: string
      publishing-tools-ref:
        default: publishing-v3
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  synchronize-build-and-stage-mip-index:
    runs-on: ubuntu-latest
    env:
      PACKAGE_INDEX_PATH: /tmp/pydevices-mip-site
    steps:
      - name: Mint an installation token for mip
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PYDEVICES_APP_ID }}
          private-key: ${{ secrets.PYDEVICES_APP_PRIVATE_KEY }}
          owner: PyDevices
          repositories: mip

      - name: Check out the MIP index source
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Check out the exact product release
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source-repository }}
          ref: ${{ inputs.source-ref }}
          path: .publication-source

      - name: Check out shared publishing tools
        uses: actions/checkout@v4
        with:
          repository: PyDevices/.github
          ref: ${{ inputs.publishing-tools-ref }}
          path: .pydevices-publishing-tools

      - name: Synchronize package sources
        env:
          PUBLICATION_PROFILE: ${{ inputs.profile }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python .pydevices-publishing-tools/scripts/synchronize_mip_package.py \
            --source-repository .publication-source \
            --source-repository-name "${{ inputs.source-repository }}" \
            --mip-repository . \
            --profile "$PUBLICATION_PROFILE" \
            --version "$RELEASE_VERSION"

      - name: Remove temporary publication checkouts
        run: rm -rf .publication-source .pydevices-publishing-tools

      - name: Build and validate the complete latest-only index
        run: |
          rm -rf "$PACKAGE_INDEX_PATH"
          source tools/ci.sh
          ci_build_packages_setup
          ci_build_packages_check_manifest
          ci_build_packages_compile_index

      - name: Commit the complete source release atomically
        env:
          SOURCE_REPOSITORY: ${{ inputs.source-repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add --all micropython
          if git diff --cached --quiet; then
            echo "MIP sources already match ${SOURCE_REPOSITORY} v${RELEASE_VERSION}."
          else
            git commit -m "Publish ${SOURCE_REPOSITORY#*/} v${RELEASE_VERSION}"
            git push origin HEAD
          fi

      - name: Assemble the GitHub Pages artifact
        run: |
          cp -R .site/. "$PACKAGE_INDEX_PATH/"
          touch "$PACKAGE_INDEX_PATH/.nojekyll"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PACKAGE_INDEX_PATH }}
