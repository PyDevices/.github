# Deploy site/ → PyDevices/PyDevices.github.io (org apex Pages).
#
# GitHub only serves https://pydevices.github.io/ from a repository named
# PyDevices.github.io. Source of truth lives in this repo under site/; the
# special-named repo is a publish target.
#
# Secret: ORG_SITE_DEPLOY_TOKEN — PAT with contents:write on
# PyDevices/PyDevices.github.io (repo secret on PyDevices/.github).
# Do not reuse MICROPYTHON_LIB_DEPLOY_TOKEN; that PAT is scoped to
# micropython-lib and gets 403 on the apex repo.
name: Deploy org site

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/deploy-org-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-org-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish site/ to PyDevices.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.ORG_SITE_DEPLOY_TOKEN }}
          external_repository: PyDevices/PyDevices.github.io
          publish_branch: main
          publish_dir: ./site
          force_orphan: true
          enable_jekyll: false
          commit_message: 'Deploy org site from PyDevices/.github'
