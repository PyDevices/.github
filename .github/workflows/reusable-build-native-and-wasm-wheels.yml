name: Reusable build native and WASM wheels

on:
  workflow_call:
    inputs:
      distribution-name:
        required: true
        type: string
      wheel-filename-prefix:
        description: Normalized wheel filename prefix, such as pydevices_pygraphics
        required: true
        type: string
      expected-wheel-count:
        default: 0
        type: number
      release-ref:
        required: true
        type: string
      version:
        required: true
        type: string
      checkout-submodules:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-desktop-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          # publishing-v7: macOS runner added (org platform-support-tiers
          # posture: ship everything CI can prove). Per-repo opt-in stays
          # in each repo's [tool.cibuildwheel] skip list — a repo that
          # skips *-macosx_* builds nothing here and wastes one no-op
          # cell; a repo adopting macOS wheels must also raise its
          # expected-wheel-count in the same change.
          - macos-latest
    steps:
      - name: Check out exact release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-ref }}
          submodules: ${{ inputs.checkout-submodules && 'recursive' || 'false' }}

      - name: Validate committed release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          COMMITTED_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$COMMITTED_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "VERSION contains $COMMITTED_VERSION but the release tag is $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Build native wheels
        uses: pypa/cibuildwheel@v4.2.0

      - name: Upload native wheels
        uses: actions/upload-artifact@v7
        with:
          name: native-wheels-${{ inputs.distribution-name }}-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-android-wheels:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-ref }}
          submodules: ${{ inputs.checkout-submodules && 'recursive' || 'false' }}

      - name: Validate committed release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          COMMITTED_VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$COMMITTED_VERSION" == "$RELEASE_VERSION" ]] || {
            echo "VERSION contains $COMMITTED_VERSION but the release tag is $RELEASE_VERSION" >&2
            exit 1
          }

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Android wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_PLATFORM: android
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload Android wheels
        uses: actions/upload-artifact@v7
        with:
          name: native-wheels-${{ inputs.distribution-name }}-android
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-wasm-wheels:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-ref }}
          submodules: ${{ inputs.checkout-submodules && 'recursive' || 'false' }}

      - name: Validate committed release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          COMMITTED_VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$COMMITTED_VERSION" == "$RELEASE_VERSION" ]] || {
            echo "VERSION contains $COMMITTED_VERSION but the release tag is $RELEASE_VERSION" >&2
            exit 1
          }

      # cibuildwheel drives pyodide-build and the emscripten xbuildenv itself,
      # and builds every Pyodide target the `build` selector allows -- currently
      # cp313/pyemscripten_2025_0 and cp314/pyemscripten_2026_0. The retired
      # scripts/build_pyodide_wheel.sh produced only the latter.
      - name: Build WASM wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_PLATFORM: pyodide

      - name: Upload WASM wheels
        uses: actions/upload-artifact@v7
        with:
          name: native-wheels-${{ inputs.distribution-name }}-wasm
          path: wheelhouse/*.whl
          if-no-files-found: error

  collect-validated-wheels:
    needs:
      - build-desktop-wheels
      - build-android-wheels
      - build-wasm-wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download every platform wheel
        uses: actions/download-artifact@v8
        with:
          pattern: native-wheels-${{ inputs.distribution-name }}-*
          merge-multiple: true
          path: dist

      - name: Validate the complete wheel set
        env:
          EXPECTED_COUNT: ${{ inputs.expected-wheel-count }}
          EXPECTED_PREFIX: ${{ inputs.wheel-filename-prefix }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install --disable-pip-version-check packaging twine
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.utils import parse_wheel_filename

          wheels = sorted(Path("dist").glob("*.whl"))
          expected_count = int(os.environ["EXPECTED_COUNT"])
          if expected_count and len(wheels) != expected_count:
              raise SystemExit(f"expected exactly {expected_count} wheels, found {len(wheels)}")
          if not wheels:
              raise SystemExit("No wheels were collected")
          expected_prefix = os.environ["EXPECTED_PREFIX"].replace("_", "-")
          expected_version = os.environ["EXPECTED_VERSION"]
          seen = set()
          for wheel in wheels:
              distribution, version, _build, _tags = parse_wheel_filename(wheel.name)
              if distribution != expected_prefix or str(version) != expected_version:
                  raise SystemExit(f"unexpected wheel identity: {wheel.name}")
              if wheel.name in seen:
                  raise SystemExit(f"duplicate wheel filename: {wheel.name}")
              seen.add(wheel.name)
              print(wheel.name)
          PY
          python -m twine check dist/*.whl

      - name: Upload complete validated wheel set
        uses: actions/upload-artifact@v7
        with:
          name: testpypi-${{ inputs.distribution-name }}-${{ inputs.version }}
          path: dist/*.whl
          if-no-files-found: error
