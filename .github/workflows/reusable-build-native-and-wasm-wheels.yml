name: Reusable build native and WASM wheels

on:
  workflow_call:
    inputs:
      distribution-name:
        required: true
        type: string
      wheel-filename-prefix:
        description: Normalized wheel filename prefix, such as pydevices_pygraphics
        required: true
        type: string
      release-ref:
        required: true
        type: string
      version:
        required: true
        type: string
      checkout-submodules:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-desktop-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-ref }}
          submodules: ${{ inputs.checkout-submodules && 'recursive' || 'false' }}

      - name: Validate committed release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          COMMITTED_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$COMMITTED_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "VERSION contains $COMMITTED_VERSION but the release tag is $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Build native wheels
        uses: pypa/cibuildwheel@v4.1.0

      - name: Upload native wheels
        uses: actions/upload-artifact@v4
        with:
          name: native-wheels-${{ inputs.distribution-name }}-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-android-wheels:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-ref }}
          submodules: ${{ inputs.checkout-submodules && 'recursive' || 'false' }}

      - name: Validate committed release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          COMMITTED_VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$COMMITTED_VERSION" == "$RELEASE_VERSION" ]] || {
            echo "VERSION contains $COMMITTED_VERSION but the release tag is $RELEASE_VERSION" >&2
            exit 1
          }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_PLATFORM: android
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload Android wheels
        uses: actions/upload-artifact@v4
        with:
          name: native-wheels-${{ inputs.distribution-name }}-android
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-wasm-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-ref }}
          submodules: ${{ inputs.checkout-submodules && 'recursive' || 'false' }}

      - name: Validate committed release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          COMMITTED_VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$COMMITTED_VERSION" == "$RELEASE_VERSION" ]] || {
            echo "VERSION contains $COMMITTED_VERSION but the release tag is $RELEASE_VERSION" >&2
            exit 1
          }

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build PyEmscripten WASM wheel
        env:
          WHEEL_PREFIX: ${{ inputs.wheel-filename-prefix }}
        run: |
          uv python install 3.14
          ./scripts/build_pyodide_wheel.sh --no-copy
          mkdir -p wheelhouse
          shopt -s nullglob
          wheels=(
            dist/${WHEEL_PREFIX}-*-pyemscripten_*_wasm32.whl
            dist/${WHEEL_PREFIX}-*-pyodide_*_wasm32.whl
            dist/${WHEEL_PREFIX}-*-emscripten_*_wasm32.whl
          )
          if ((${#wheels[@]} == 0)); then
            echo "No WASM wheel found in dist/ for $WHEEL_PREFIX" >&2
            exit 1
          fi
          cp -f "${wheels[@]}" wheelhouse/

      - name: Upload WASM wheel
        uses: actions/upload-artifact@v4
        with:
          name: native-wheels-${{ inputs.distribution-name }}-wasm
          path: wheelhouse/*.whl
          if-no-files-found: error

  collect-validated-wheels:
    needs:
      - build-desktop-wheels
      - build-android-wheels
      - build-wasm-wheel
    runs-on: ubuntu-latest
    steps:
      - name: Download every platform wheel
        uses: actions/download-artifact@v4
        with:
          pattern: native-wheels-${{ inputs.distribution-name }}-*
          merge-multiple: true
          path: dist

      - name: Validate the complete wheel set
        env:
          EXPECTED_PREFIX: ${{ inputs.wheel-filename-prefix }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install --disable-pip-version-check packaging twine
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.utils import parse_wheel_filename

          wheels = sorted(Path("dist").glob("*.whl"))
          if not wheels:
              raise SystemExit("No wheels were collected")
          expected_prefix = os.environ["EXPECTED_PREFIX"].replace("_", "-")
          expected_version = os.environ["EXPECTED_VERSION"]
          seen = set()
          for wheel in wheels:
              distribution, version, _build, _tags = parse_wheel_filename(wheel.name)
              if distribution != expected_prefix or str(version) != expected_version:
                  raise SystemExit(f"unexpected wheel identity: {wheel.name}")
              if wheel.name in seen:
                  raise SystemExit(f"duplicate wheel filename: {wheel.name}")
              seen.add(wheel.name)
              print(wheel.name)
          PY
          python -m twine check dist/*.whl

      - name: Upload complete validated wheel set
        uses: actions/upload-artifact@v4
        with:
          name: testpypi-${{ inputs.distribution-name }}-${{ inputs.version }}
          path: dist/*.whl
          if-no-files-found: error
