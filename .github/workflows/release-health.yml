# The Release Health dashboard. Every publishing-v5 run (success or failure)
# dispatches a release-health event here; this regenerates RELEASE_HEALTH.md
# from the accumulated per-distribution state.
name: Release health

on:
  repository_dispatch:
    types: [release-health]

permissions:
  contents: write

concurrency:
  group: release-health
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fold in the report, regenerate the page, and commit
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          DISTRIBUTION: ${{ github.event.client_payload.distribution }}
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
        run: |
          # The fold goes in a file because it has to be re-runnable: one
          # release reports several distributions, each dispatching its own
          # event, and a repository_dispatch freezes github.sha at creation
          # time -- so a second run checks out a tip that predates the first
          # run's commit and its push is rejected (.github#34). A plain rebase
          # is not enough here: RELEASE_HEALTH.md is regenerated whole and
          # data.json is one sorted object, so replaying our diff onto the new
          # tip conflicts or drops the other distribution's row. Instead,
          # discard our commit, take the branch tip, and fold this payload in
          # again -- the fold is idempotent, so the result carries both rows.
          cat > "$RUNNER_TEMP/fold.py" <<'PY'
          import json, os, datetime
          p = json.loads(os.environ["PAYLOAD"])
          path = "release-health/data.json"
          os.makedirs("release-health", exist_ok=True)
          data = json.load(open(path)) if os.path.exists(path) else {}
          key = p.get("distribution") or p.get("repo")
          p["updated"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          # A partial report (reusable-report-pypi-result.yml) carries one
          # stage's outcome, sent after the coordinator's full report: the
          # caller-side PyPI upload. It updates that row in place, as long as
          # the row is for the same version; otherwise it stands alone.
          old = data.get(key, {})
          if str(p.pop("partial", "")).lower() == "true" and old.get("version") == p.get("version"):
              p = {**old, **p}
          data[key] = p
          json.dump(data, open(path, "w"), indent=1, sort_keys=True)
          def mark(v):
              return {"success": "OK", "skipped": "--", "failure": "FAIL",
                      "cancelled": "cancelled"}.get(v, v or "?")
          rows = []
          for k in sorted(data):
              d = data[k]
              ver = d.get("version", "?") + (" (pre)" if str(d.get("prerelease")).lower() == "true" else "")
              rows.append("| [{k}]({u}) | {v} | {t} | {a} | {m} | {y} | {up} |".format(
                  k=k, u=d.get("run_url", ""), v=ver, t=mark(d.get("testpypi")),
                  a=mark(d.get("assets")), m=mark(d.get("mip")), y=mark(d.get("pypi")),
                  up=d.get("updated", "")))
          open("RELEASE_HEALTH.md", "w").write(
              "# Release health\n\nLatest publish run per distribution, reported by "
              "publishing-v6's report-release-health job (link = the run).\n\n"
              "| Distribution | Version | TestPyPI | Assets | MIP | PyPI | Updated |\n"
              "|---|---|---|---|---|---|---|\n" + "\n".join(rows) + "\n")
          PY

          git config user.name "pydevices-release-automation[bot]"
          git config user.email "pydevices-release-automation[bot]@users.noreply.github.com"
          BRANCH=$(git rev-parse --abbrev-ref HEAD)

          for attempt in 1 2 3; do
            python3 "$RUNNER_TEMP/fold.py"
            git add RELEASE_HEALTH.md release-health/data.json
            if git diff --cached --quiet; then
              echo "Nothing to record for $DISTRIBUTION $RELEASE_VERSION."
              exit 0
            fi
            git commit -q -m "release-health: $DISTRIBUTION $RELEASE_VERSION"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); re-folding onto the branch tip"
            git fetch --quiet origin "$BRANCH"
            git reset --quiet --hard FETCH_HEAD
          done
          echo "::error::release-health could not push after 3 attempts"
          exit 1
